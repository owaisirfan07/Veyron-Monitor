name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Read versionCode
        id: version
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VeyronMonitor-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk VeyronMonitor.apk

      - name: Publish GitHub Release for this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.code }}
          name: Version ${{ steps.version.outputs.code }}
          body: "Automatically built from commit ${{ github.sha }}"
          files: VeyronMonitor.apk
